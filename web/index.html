    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
      }
      #boot img {
        width: 64px;
        height: 64px;
      }
      #boot .bar {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: #e6e6e6;
        overflow: hidden;
      }
      #boot .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #0099ff;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-60%);
        }
        to {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar span {
          animation: none;
          width: 100%;
        }
      }
    </style>
